<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="description"
      content="Login to your Neema Charo Academy account.">

<title>Login | Neema Charo Academy</title>

<link rel="stylesheet" href="style.css">

</head><body><!-- ================= HEADER ================= --><header class="header"><nav class="navbar">

    <a href="index.html" class="logo">
        Neema<span>Charo</span>
    </a>

    <a href="register.html"
       class="btn primary-btn">

        Create Account

    </a>

</nav>

</header><!-- ================= LOGIN ================= --><section class="section"><div class="container">

    <div class="contact-form-box reveal"
         style="max-width:550px; margin:40px auto;">

        <div style="text-align:center;">

            <p class="section-label">
                NEEMA CHARO ACADEMY
            </p>

            <h1 style="margin:10px 0 15px;">
                Welcome Back
            </h1>

            <p style="color:var(--text);">
                Login to continue learning.
            </p>

        </div>


        <form id="loginForm">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required>


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required>


            <button
                type="submit"
                class="btn primary-btn">

                Login 🔐

            </button>

        </form>


        <p id="loginMessage"
           style="margin-top:20px;
                  text-align:center;">
        </p>


        <div style="text-align:center;
                    margin-top:20px;">

            <a href="#"
               id="forgotPassword"
               style="color:var(--primary);
                      font-weight:700;">

                Forgot your password?

            </a>

        </div>


        <div style="text-align:center;
                    margin-top:25px;">

            <p>
                Don't have an account?

                <a href="register.html"
                   style="color:var(--primary);
                          font-weight:700;">

                    Create Account

                </a>

            </p>

        </div>

    </div>

</div>

</section><!-- ================= FOOTER ================= --><footer class="footer"><div class="container">

    <div class="footer-bottom">

        <p>

            © <span id="year"></span>
            Neema Charo. All Rights Reserved.

        </p>

    </div>

</div>

</footer><!-- ================= SCRIPTS ================= --><script src="script.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>

const SUPABASE_URL =
    "https://evxseeuqsstmgsalaxqi.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_eE3XDBtIl6kZY8inetfuuw_MLQGljlA";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );



/* ================= LOGIN ================= */

const loginForm =
    document.getElementById("loginForm");

const loginMessage =
    document.getElementById("loginMessage");


loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            document.getElementById("email")
            .value
            .trim();


        const password =
            document.getElementById("password")
            .value;


        loginMessage.textContent =
            "Logging in...";


        const { data, error } =
            await supabaseClient.auth.signInWithPassword({

                email: email,

                password: password

            });


        if (error) {

            loginMessage.textContent =
                error.message;

            return;

        }


        loginMessage.textContent =
            "Login successful!";


        window.location.href =
            "dashboard.html";

    }
);



/* ================= FORGOT PASSWORD ================= */

document.getElementById(
    "forgotPassword"
).addEventListener(
    "click",
    async function(event) {

        event.preventDefault();


        const email =
            document.getElementById("email")
            .value
            .trim();


        if (!email) {

            loginMessage.textContent =
                "Enter your email address first.";

            return;

        }


        const { error } =
            await supabaseClient.auth
            .resetPasswordForEmail(
                email,
                {
                    redirectTo:
                        window.location.origin +
                        "/reset-password.html"
                }
            );


        if (error) {

            loginMessage.textContent =
                error.message;

            return;

        }


        loginMessage.textContent =
            "Password reset instructions have been sent to your email.";

    }
);

</script></body></html>
