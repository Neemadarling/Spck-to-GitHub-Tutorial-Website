<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Neema Charo Academy administrator payment dashboard.">

    <meta name="author"
          content="Neema Charo">

    <title>Admin | Neema Charo Academy</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


<!-- ================= HEADER ================= -->

<header class="header">

    <nav class="navbar">

        <a href="index.html"
           class="logo">

            Neema<span>Charo</span>

        </a>


        <button
            id="logoutButton"
            class="btn primary-btn">

            Logout

        </button>

    </nav>

</header>



<!-- ================= ADMIN ================= -->

<section class="section">

    <div class="container">


        <div class="section-heading">

            <p class="section-label">
                NEEMA CHARO ACADEMY
            </p>

            <h1>
                Payment Dashboard
            </h1>

            <p>
                Review student payment submissions.
            </p>

        </div>



        <!-- MESSAGE -->

        <div id="adminMessage"
             class="practice-box"
             style="text-align:center;">

            Loading payments...

        </div>



        <!-- PAYMENTS -->

        <div id="paymentsContainer">

        </div>


    </div>

</section>



<!-- ================= FOOTER ================= -->

<footer class="footer">

    <div class="container">

        <div class="footer-bottom">

            <p>

                © <span id="year"></span>
                Neema Charo. All Rights Reserved.

            </p>

        </div>

    </div>

</footer>



<!-- ================= SUPABASE ================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://evxseeuqsstmgsalaxqi.supabase.co";


const SUPABASE_ANON_KEY =
    "sb_publishable_eE3XDBtIl6kZY8inetfuuw_MLQGljlA";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );



/* =====================================================
   ADMIN EMAIL
===================================================== */

const ADMIN_EMAIL =
    "charoneema6@gmail.com";



/* =====================================================
   ELEMENTS
===================================================== */

const adminMessage =
    document.getElementById("adminMessage");


const paymentsContainer =
    document.getElementById("paymentsContainer");


document.getElementById("year").textContent =
    new Date().getFullYear();



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}



/* =====================================================
   CHECK ADMIN
===================================================== */

async function checkAdmin() {

    const {
        data,
        error
    } =
        await supabaseClient.auth.getUser();


    if (error) {

        console.error(error);

        adminMessage.textContent =
            "Unable to verify administrator account.";

        return false;

    }


    const user =
        data.user;


    if (!user) {

        adminMessage.innerHTML = `

            Please login first.

            <br><br>

            <a href="login.html"
               class="btn primary-btn">

                Login

            </a>

        `;

        return false;

    }


    const email =
        (user.email || "").toLowerCase();


    if (
        email !==
        ADMIN_EMAIL.toLowerCase()
    ) {

        adminMessage.textContent =
            "Access denied. Administrator account required.";

        return false;

    }


    return true;

}



/* =====================================================
   LOAD PAYMENTS
===================================================== */

async function loadPayments() {


    const isAdmin =
        await checkAdmin();


    if (!isAdmin) return;



    adminMessage.textContent =
        "Loading payment submissions...";


    paymentsContainer.innerHTML =
        "";



    const {
        data: payments,
        error
    } =
        await supabaseClient
        .from("payments")
        .select("*")
        .order(
            "created_at",
            {
                ascending: false
            }
        );



    /* ================= ERROR ================= */

    if (error) {

        console.error(
            "PAYMENT LOAD ERROR:",
            error
        );


        adminMessage.innerHTML = `

            <strong>
                Unable to load payments.
            </strong>

            <br><br>

            <small>
                ${escapeHTML(error.message)}
            </small>

        `;

        return;

    }



    /* ================= EMPTY ================= */

    if (
        !payments ||
        payments.length === 0
    ) {

        adminMessage.textContent =
            "No payment submissions yet.";

        return;

    }



    /* ================= SUCCESS ================= */

    adminMessage.innerHTML = `

        <strong>
            Payment submissions: ${payments.length}
        </strong>

    `;



    /* ================= CREATE CARDS ================= */

    payments.forEach(function(payment) {


        const card =
            document.createElement("div");


        /* IMPORTANT:
           No "reveal" class here.
        */

        card.className =
            "feature-card";


        card.style.marginBottom =
            "25px";


        card.style.opacity =
            "1";


        card.style.visibility =
            "visible";


        card.style.display =
            "block";



        const status =
            String(
                payment.status || "pending"
            ).toLowerCase();



        let actionHTML =
            "";



        if (
            status === "pending"
        ) {

            actionHTML = `

                <button
                    class="btn primary-btn approve-button">

                    Approve Payment ✅

                </button>

            `;

        }

        else {

            actionHTML = `

                <p style="
                    font-weight:700;
                    margin-top:20px;
                ">

                    Payment already
                    ${escapeHTML(status)}.

                </p>

            `;

        }



        card.innerHTML = `

            <div class="feature-icon">
                💳
            </div>


            <h3>
                ${escapeHTML(payment.full_name)}
            </h3>


            <p>

                <strong>
                    Phone:
                </strong>

                ${escapeHTML(payment.phone)}

            </p>


            <p>

                <strong>
                    Transaction Code:
                </strong>

                ${escapeHTML(
                    payment.transaction_code
                )}

            </p>


            <p>

                <strong>
                    Amount:
                </strong>

                KSh ${escapeHTML(
                    payment.amount
                )}

            </p>


            <p>

                <strong>
                    Course:
                </strong>

                ${escapeHTML(payment.course)}

            </p>


            <p>

                <strong>
                    Status:
                </strong>

                ${escapeHTML(payment.status)}

            </p>


            <p>

                <strong>
                    Date:
                </strong>

                ${payment.created_at
                    ? new Date(
                        payment.created_at
                      ).toLocaleString()
                    : "Not available"
                }

            </p>


            ${actionHTML}

        `;



        /* ================= APPROVE BUTTON ================= */

        const approveButton =
            card.querySelector(
                ".approve-button"
            );


        if (approveButton) {

            approveButton.addEventListener(
                "click",
                function() {

                    approvePayment(
                        payment.id,
                        payment.user_id,
                        payment.course,
                        approveButton
                    );

                }
            );

        }



        paymentsContainer.appendChild(
            card
        );

    });

}



/* =====================================================
   APPROVE PAYMENT
===================================================== */

async function approvePayment(
    paymentId,
    userId,
    courseName,
    button
) {


    const confirmed =
        confirm(
            "Have you verified this M-Pesa transaction?\n\n" +
            "Click OK only if the payment is genuine."
        );


    if (!confirmed) return;



    button.disabled =
        true;


    button.textContent =
        "Approving...";



    /* ================= UPDATE PAYMENT ================= */

    const {
        error: paymentError
    } =
        await supabaseClient
        .from("payments")
        .update({
            status: "approved"
        })
        .eq(
            "id",
            paymentId
        );



    if (paymentError) {

        console.error(
            paymentError
        );


        alert(
            "Could not approve payment:\n\n" +
            paymentError.message
        );


        button.disabled =
            false;


        button.textContent =
            "Approve Payment ✅";

        return;

    }



    /* ================= COURSE ACCESS ================= */

    const {
        error: accessError
    } =
        await supabaseClient
        .from("course_access")
        .insert({

            user_id:
                userId,

            course_name:
                courseName,

            status:
                "active"

        });



    if (accessError) {

        console.error(
            accessError
        );


        alert(
            "Payment was approved, but course access could not be created:\n\n" +
            accessError.message
        );


        loadPayments();

        return;

    }



    /* ================= SUCCESS ================= */

    alert(
        "Payment approved successfully! 🎉\n\n" +
        "Course access has been granted."
    );


    loadPayments();

}



/* =====================================================
   LOGOUT
===================================================== */

document.getElementById(
    "logoutButton"
).addEventListener(
    "click",
    async function() {


        await supabaseClient.auth.signOut();


        window.location.href =
            "login.html";

    }
);



/* =====================================================
   START
===================================================== */

loadPayments();

</script>


</body>

</html>
